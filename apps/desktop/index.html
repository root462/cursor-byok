<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="stylesheet" href="./src/styles/liquid-glass.css" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      /* 只给 html 留启动底色，body / #root 必须透明，
         否则会盖住 globals.scss 铺在 html 上的 Harmony.jpg 底图。 */
      html {
        background-color: var(--startup-background, #f5f5f5);
      }
    </style>
    <script>
      (() => {
        try {
          // 应用只有亮色主题，启动即固定，避免首屏闪色。
          document.documentElement.dataset.theme = "default-light";
          document.documentElement.style.setProperty("--startup-background", "#f5f5f5");
          document.documentElement.style.colorScheme = "light";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#f5f5f5");
        } catch {
          // The inline CSS already provides the dark-theme fallback.
        }
      })();
    </script>
    <title>Cursor BYOK</title>
  </head>

  <body>
    <noscript>Cursor BYOK 需要 JavaScript 才能运行。</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
